# Daily development installs every app with one pnpm install (shared store).
# Each app is self-contained: exact versions in its own package.json (generated
# from stack.json) and its own package-lock.json for standalone npm installs.
packages:
  - apps/*

# No package needs an install script for the browser builds; onnxruntime-node's
# would download GPU binaries. Apps set the same thing for npm in their .npmrc.
ignoredBuiltDependencies:
  - '@vaadin/vaadin-usage-statistics'
  - better-sqlite3
  - msgpackr-extract
  - onnxruntime-node
  - protobufjs
