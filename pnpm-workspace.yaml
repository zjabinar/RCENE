packages:
  - apps/*
  - packages/*

# Every version lives here. Apps and packages reference them as "catalog:".
# Majors are pinned to versions the coding model knows well; newer majors
# (TypeScript 7, react-router 8, motion 13+, TanStack Table 9, vitest 5,
# lucide-react 1) are deliberately avoided. Upgrade only after the event.
catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  typescript: ~6.0.3
  vite: ^8.3.2
  '@vitejs/plugin-react': ^6.1.1
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  tw-animate-css: ^1.4.0
  '@fontsource-variable/inter': ^5.3.0
  react-router: ^7.18.4
  zustand: ^5.0.15
  zod: ^4.6.5
  react-hook-form: ^7.89.0
  '@hookform/resolvers': ^5.9.1
  '@tanstack/react-table': ^8.21.3
  recharts: ^3.10.1
  maplibre-gl: ^6.11.2
  react-map-gl: ^8.1.3
  '@turf/turf': ^7.4.0
  motion: ^12.43.0
  gsap: ^3.15.0
  '@gsap/react': ^2.1.2
  lenis: ^1.3.26
  three: ^0.186.1
  '@types/three': ^0.186.0
  '@react-three/fiber': ^9.8.1
  '@react-three/drei': ^10.7.9
  qrcode: ^1.5.4
  '@types/qrcode': ^1.5.6
  html5-qrcode: 2.3.8
  fuse.js: ^7.5.0
  vite-plugin-pwa: ^1.3.0
  deck.gl: ^9.4.0
  '@deck.gl/mapbox': ^9.4.0
  '@huggingface/transformers': ^4.3.0
  lucide-react: ^0.577.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  radix-ui: ^1.4.3
  sonner: ^2.0.8
  vitest: ^4.1.11
  jsdom: ^27.4.0
  '@types/node': ^22.20.5
  '@types/geojson': ^7946.0.16
  oxlint: ^1.86.0
  mapshaper: ^0.6.121
  '@tmcw/togeojson': ^7.1.2
  '@xmldom/xmldom': ^0.9.12
  fflate: ^0.8.3
  playwright: ^1.63.0
  axe-core: ^4.13.0
  '@playwright/mcp': ^0.0.83

# Native build scripts are not needed: the apps use the browser builds, and
# mapshaper works for Shapefile/GeoJSON/TopoJSON without its optional natives.
ignoredBuiltDependencies:
  - '@vaadin/vaadin-usage-statistics'
  - better-sqlite3
  - msgpackr-extract
  - onnxruntime-node
  - protobufjs
