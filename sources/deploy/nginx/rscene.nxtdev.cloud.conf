# /etc/nginx/sites-available/rscene.nxtdev.cloud  (symlinked into sites-enabled/)
#
# RSCENE 2026 entry on the shared Hostinger VPS, next to erms, motiong, govaideas, pop,
# aislecue. Same conventions as erms.nxtdev.cloud: one file per FQDN, HTTP first, then
# `certbot --nginx -d rscene.nxtdev.cloud --redirect` adds the 443 block and the redirect.
#
#   static app : /srv/rscene/current/dist   (Vite build; includes /data/ files)
#   AI relay   : 127.0.0.1:8010             (rscene-api.service, /api/ only)
#
# Never `systemctl restart nginx` on this box: `nginx -t` then `systemctl reload nginx`.

# Per-IP limit on the AI relay (each completion spends API credit). Zone names are global
# to nginx: keep the "rscene_" prefix so no other site collides.
limit_req_zone $binary_remote_addr zone=rscene_ai:10m rate=12r/m;

server {
    listen 80;                        # IPv4 only, like the other sites on this VPS
    server_name rscene.nxtdev.cloud;

    root /srv/rscene/current/dist;
    index index.html;

    client_max_body_size 1M;          # the relay caps a request at 256 KB
    access_log /var/log/nginx/rscene.access.log;
    error_log  /var/log/nginx/rscene.error.log;

    # Security headers (no CSP: index.html carries the inline theme boot script)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain application/manifest+json;

    # AI relay: status is cheap, completions are rate limited per IP.
    location = /api/ai/complete {
        limit_req zone=rscene_ai burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;       # above AI_TIMEOUT_MS (30 s) + margin
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }

    # Vite's hashed bundles never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Data layers (GeoJSON) and fonts/icons: short cache, they change between deploys.
    location /data/ {
        expires 1h;
        try_files $uri =404;
    }

    # The app shell: never cached, so a deploy shows at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    # Client-side routes (/console/new, /admin/ai, /poster, …) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
